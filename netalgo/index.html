let cur=A[0],t=0,play=true,sp=1,last=performance.now(),drag=false;
const side=$('#side');let g='';
A.forEach((a,i)=>{if(a.g!=g){g=a.g;side.insertAdjacentHTML('beforeend','<h4>['+g+']</h4>')}const b=document.createElement('button');b.textContent=a.n;b.onclick=()=>pick(i);a.el=b;side.appendChild(b)});
function pick(i){cur=A[i];t=0;SEL=-1;REQ=-1;lastLog='';$('#rd').innerHTML='';$('#lgb').innerHTML='';$('#lg').style.display=cur.loop?'block':'none';A.forEach(a=>a.el.classList.toggle('on',a==cur));
 $('#ib').innerHTML='<h2>'+cur.n+'<span class="cur">_</span></h2><p class="tag">'+cur.g+'</p><p>'+cur.i.d+'</p><h3>HOW IT WORKS</h3><ol>'+cur.i.s.map(s=>'<li>'+s+'</li>').join('')+'</ol><h3>COMPLEXITY</h3><p>'+cur.i.c+'</p><h3>USED IN</h3><p>'+cur.i.u+'</p>'}
const setPP=()=>$('#pp').innerHTML=play?'&#10074;&#10074; PAUSE':'&#9654; PLAY';
$('#pp').onclick=()=>{play=!play;setPP()};
$('#rs').onclick=()=>{t=0};
$('#sp').onchange=e=>sp=+e.target.value;
$('#mn').onclick=()=>document.body.classList.toggle('nc');
const PAL={'Cisco Blue':['#04101f','#cfe6ff','#3aa0ff','#ffc400','#35e0c8','#ff5470'],'Phosphor':['#060b08','#b8f5c8','#39ff7a','#ffb000','#4dd8ff','#ff4d4d'],'Amber CRT':['#0d0800','#ffd9a0','#ffb000','#ff7a1a','#ffe066','#ff4d4d'],'Synthwave':['#120a24','#f0d9ff','#ff4fd8','#ffe14d','#3df0ff','#ff5470'],'Ice Mono':['#0b0f14','#e6edf3','#9fb3c8','#f0c674','#7fdbff','#ff6b6b'],'Paper':['#d8d4c3','#1a1a1a','#0b6b2f','#a35200','#0a5f7a','#b3261e']};
const KS=['bg','ink','acc','amb','cy','red'],NM=['Background','Text','Accent 1','Accent 2','Accent 3','Alert'];let PP;
const mix=(a,b,f)=>{const g=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=g(a),B=g(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*f).toString(16).padStart(2,'0')).join('')};
function setIcon(p){const t=(c,w,y,l)=>`<rect class='s' x='16' y='${y}' width='32' height='10' rx='2'/><circle class='${l}' cx='22' cy='${y+5}' r='2.2'/>`;
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><style>.f{fill:${p[0]}}.b{fill:none;stroke:${p[2]};stroke-width:4}.s{fill:none;stroke:${p[2]};stroke-width:3;stroke-linejoin:round}.l{fill:${p[2]}}.a{fill:${p[3]}}</style><rect class='f' width='64' height='64' rx='12'/><rect class='b' x='5' y='5' width='54' height='54' rx='9'/>${t(0,0,14,'a')}${t(0,0,27,'l')}${t(0,0,40,'l')}<path class='s' d='M38 19.5h6M38 32.5h6M38 45.5h6'/></svg>`;
 $('#ic').href='data:image/svg+xml,'+encodeURIComponent(svg)}
function applyPal(p){PP=p;setIcon(p);const r=document.documentElement.style;KS.forEach((k,i)=>r.setProperty('--'+k,p[i]));r.setProperty('--panel',mix(p[0],p[1],.07));r.setProperty('--dim',mix(p[0],p[1],.45));r.setProperty('--line',mix(p[0],p[2],.55));document.querySelectorAll('#cp input').forEach((e,i)=>e.value=p[i]);try{localStorage.setItem('na-pal',JSON.stringify(p))}catch(e){}}
Object.keys(PAL).forEach(n=>{const b=document.createElement('button');b.className='b';b.textContent=n;b.onclick=()=>applyPal([...PAL[n]]);$('#pr').appendChild(b)});
NM.forEach((n,i)=>{const l=document.createElement('label');l.innerHTML=n+' <input type="color">';l.lastChild.oninput=e=>{const q=[...PP];q[i]=e.target.value;applyPal(q)};$('#cp').appendChild(l)});
$('#pl').onclick=()=>{$('#pop').hidden=!$('#pop').hidden};
applyPal([...PAL['Phosphor']]);
const sc=$('#sc');sc.onpointerdown=()=>drag=true;sc.onpointerup=()=>drag=false;sc.oninput=()=>{t=sc.value/1000*cur.T};
function fs(on){document.body.classList.toggle('fs',on);$('#fs').innerHTML=on?'&#9974; EXIT':'&#9974; FULL';
 try{if(on)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
$('#fs').onclick=()=>fs(!document.body.classList.contains('fs'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs'))fs(false)});
addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='SELECT'){e.preventDefault();$('#pp').click()}if(e.key=='Escape'&&document.body.classList.contains('fs'))fs(false)});
let lastLog='';
const conAt=(c,k)=>c.dur?[0,1,2].map(i=>c.seq.reduce((n,q,j)=>n+(q==i&&j<k&&j+1+c.dur[j]>k+.4?1:0),0)):null,
stat=(c,k,tt)=>tt<k+1?'IN-FLIGHT':c.dur?(tt<k+1+c.dur[k]?'ACTIVE':'CLOSED'):'200 OK';
function det(){const c=CFG,k=SEL,el=$('#rd');if(k<0||k>REQ||!c){el.innerHTML='';return}
 const s=c.seq[k],cn=conAt(c,k),tt=t-INTRO;
 el.innerHTML=`<h3>REQUEST #${k+1} DETAILS</h3><p>Source: ${ipOf(c,k)}:${pt(k)}</p><p>Dest VIP: 198.51.100.10:443</p><p>Request: ${PATHS[k*3%6]} HTTP/1.1</p><p>Algorithm: ${c.rule}</p>${c.sc?'<p>Scores: '+c.names.map((n,i)=>n.split(' ')[0]+'='+c.sc[k][i]).join(' · ')+' (lowest wins)</p>':''}${cn?'<p>Active conns on arrival: '+cn.join(' / ')+'</p>':''}<p>Chosen: ${c.names[s]} (${sv(s)}:8080)</p><p>Status: ${stat(c,k,tt)}${c.dur?' · session '+c.dur[k]+'s':''}</p><p>Response: ${(c.rt||[60,60,60])[s]+k*7%23} ms</p>`}
$('#lgb').onclick=e=>{const r=e.target.closest('tr');if(r){SEL=+r.dataset.k;lastLog=''}};
function logUpd(){const c=CFG,tt=t-INTRO;let h='';for(let k=0;k<=REQ;k++)h+=`<tr class="r${k==SEL?' on':''}" data-k="${k}"><td>${k+1}</td><td>T+${k}s</td><td>${ipOf(c,k)}:${pt(k)}</td><td>${PATHS[k*3%6]}</td><td>${c.names[c.seq[k]].split(' ')[0]} ${sv(c.seq[k])}</td><td>${stat(c,k,tt)}</td></tr>`;
 if(h!==lastLog){lastLog=h;$('#lgb').innerHTML=h;$('#lg').scrollTop=1e5;det()}}
function frame(n){
 const dt=Math.min(.05,(n-last)/1e3);last=n;if(play&&!drag)t+=dt*sp;if(t>=cur.T)t=cur.loop||0;
 if(W<2||H<2)fit();cols();x.setTransform(devicePixelRatio||1,0,0,devicePixelRatio||1,0,0);x.globalAlpha=1;x.clearRect(0,0,W,H);
 tx('> '+cur.n.toUpperCase()+' :: '+cur.key,W*.04,26,K.ink,W<600?16:22);
 try{cur.draw(t)}catch(e){tx('render error: '+e.message,W*.04,H/2,K.red,20)}
 if(cur.loop&&CFG)logUpd();if(!drag)sc.value=t/cur.T*1000;$('#tm').textContent=t.toFixed(1)+'s';
 requestAnimationFrame(frame)}
pick(0);setPP();requestAnimationFrame(frame);
(()=>{const b=document.getElementById('boot'),t0=performance.now();let gone=0;
 const hide=()=>{if(gone)return;gone=1;t=0;b.classList.add('done');setTimeout(()=>b.remove(),600)};
 addEventListener('load',()=>setTimeout(hide,Math.max(0,1900-(performance.now()-t0))));
 setTimeout(hide,5000)})();
